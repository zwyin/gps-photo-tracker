[project]
name = "gps-photo-tracker"
version = "0.26.0"
description = "Batch process photos with GPS tracks (GPX/KML/TCX/FIT) to write EXIF GPS tags"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "piexif>=1.1.3",
    "gpxpy>=1.6.0",
    "garmin-fit-sdk>=21.115",
    "geopy>=2.4.0",
    "tenacity>=8.0.0",
    # macOS native file/dir picker (gui/mac_native_picker.py) uses NSOpenPanel
    # via `from AppKit import NSOpenPanel`. The AppKit module is a top-level
    # package of pyobjc-framework-Cocoa (its top_level.txt declares AppKit,
    # Foundation, Cocoa, CoreFoundation); there is NO standalone
    # "pyobjc-framework-AppKit" distribution on PyPI. PyInstaller's standard
    # module-graph analysis follows the import and bundles it, so NO manual
    # AppKit/Foundation entries belong in gps-photo-tracker.spec hiddenimports.
    'pyobjc-framework-Cocoa>=10.0; sys_platform=="darwin"',
]

[project.urls]
Repository = "https://github.com/zwyin/gps-photo-tracker"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-qt>=4.0",
    "hypothesis>=6.0",
    # Pillow is a TEST-only dependency: the test suite imports PIL.Image to
    # build JPEG fixtures. The production app never imports PIL (thumbnails use
    # PySide6 QPixmap; EXIF uses piexif). Keeping Pillow out of runtime
    # dependencies fixed the Windows packaged-build crash.
    "Pillow>=10.0.0",
]

[project.scripts]
gps-photo-tracker = "gps_photo_tracker.__main__:main"
gps-photo-tracker-cli = "gps_photo_tracker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow"]

[tool.coverage.run]
source = ["src/gps_photo_tracker"]

[tool.coverage.report]
fail_under = 75

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
