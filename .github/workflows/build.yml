name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ --cov=gps_photo_tracker --cov-report=term-missing -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: gps-photo-tracker-macos
            build_cmd: python -m PyInstaller gps-photo-tracker.spec --noconfirm
            artifact_path: "dist/GPS Photo Tracker.app"
          - os: windows-latest
            artifact: gps-photo-tracker-windows
            build_cmd: python -m PyInstaller --onefile --windowed --name "GPS Photo Tracker" src/gps_photo_tracker/__main__.py
            artifact_path: "dist/GPS Photo Tracker.exe"
          - os: ubuntu-latest
            artifact: gps-photo-tracker-linux
            build_cmd: python -m PyInstaller --onefile --windowed --name "GPS Photo Tracker" src/gps_photo_tracker/__main__.py
            artifact_path: "dist/GPS Photo Tracker"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: pip install -e ".[dev]" pyinstaller

      - name: Build
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          retention-days: 30
