name: Build, Test & Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ --cov=gps_photo_tracker --cov-report=term-missing -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            build_cmd: python -m PyInstaller gps-photo-tracker.spec --noconfirm
          - os: windows-latest
            platform: windows
            build_cmd: python -m PyInstaller --onefile --windowed --name "GPS Photo Tracker" src/gps_photo_tracker/__main__.py
          - os: windows-latest
            platform: windows-debug
            build_cmd: python -m PyInstaller --onefile --console --name "GPS-Photo-Tracker-debug" src/gps_photo_tracker/__main__.py
          - os: ubuntu-latest
            platform: linux
            build_cmd: python -m PyInstaller --onefile --windowed --name "GPS Photo Tracker" src/gps_photo_tracker/__main__.py

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: pip install -e ".[dev]" pyinstaller

      - name: Build
        run: ${{ matrix.build_cmd }}

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd dist
          zip -r -q "GPS-Photo-Tracker-v${{ steps.version.outputs.version }}-macos.zip" "GPS Photo Tracker.app"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: |
          cd dist
          Compress-Archive -Path "GPS Photo Tracker.exe" -DestinationPath "GPS-Photo-Tracker-v${{ steps.version.outputs.version }}-windows.zip"
        shell: pwsh

      - name: Package (Windows debug)
        if: matrix.platform == 'windows-debug'
        run: |
          cd dist
          Compress-Archive -Path "GPS-Photo-Tracker-debug.exe" -DestinationPath "GPS-Photo-Tracker-v${{ steps.version.outputs.version }}-windows-debug.zip"
        shell: pwsh

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd dist
          tar -czf "GPS-Photo-Tracker-v${{ steps.version.outputs.version }}-linux.tar.gz" "GPS Photo Tracker"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GPS-Photo-Tracker-v${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/GPS-Photo-Tracker-v${{ steps.version.outputs.version }}-*.zip
            dist/GPS-Photo-Tracker-v${{ steps.version.outputs.version }}-*.tar.gz
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --generate-notes \
            artifacts/*.zip artifacts/*.tar.gz
